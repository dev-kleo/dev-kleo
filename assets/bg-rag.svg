<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 210" width="390" height="210" role="img" aria-label="Grounded RAG. Answers for universities grounded in official documents, with citations and a refusal when retrieval is weak."><style>
.k{font:600 14px 'SFMono-Regular',Consolas,monospace;fill:#ff6a2b;letter-spacing:3px}
.h{font:800 44px Impact,'Arial Narrow',sans-serif;fill:#f7f9f8;letter-spacing:1px}
.t{font:700 26px Impact,'Arial Narrow',sans-serif;fill:#f7f9f8;letter-spacing:.5px}
.b{font:400 16px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#cfe7ea}
.c{font:600 13px 'SFMono-Regular',Consolas,monospace;fill:#f7f9f8}
.in{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.ln{stroke-dasharray:1200;stroke-dashoffset:1200;animation:ln 1.6s .2s ease-out forwards}
@keyframes ln{to{stroke-dashoffset:0}}
.sw{stroke-dasharray:60 1000;animation:sw 5s linear infinite}
@keyframes sw{to{stroke-dashoffset:-1060}}
.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07606b"/><stop offset="1" stop-color="#032f36"/></linearGradient></defs>
<g class="in" style="animation-delay:0.15s">
<rect x="2" y="2" width="386" height="206" rx="18" fill="url(#g)" stroke="#2fb4c4" stroke-opacity=".35" stroke-width="1.5"/>
<rect class="sw" x="2" y="2" width="386" height="206" rx="18" fill="none" stroke="#ff6a2b" stroke-width="2.5" pathLength="1000" style="animation-delay:0.3s"/>
<circle cx="350" cy="40" r="6" fill="#ff6a2b" class="pu"/>
<text class="k" x="28" y="36">METHOD</text><text class="t" x="28" y="64">Grounded RAG</text><text class="b" x="28" y="84">Answers for universities grounded in</text><text class="b" x="28" y="108">official documents, with citations and a</text><text class="b" x="28" y="132">refusal when retrieval is weak.</text><rect x="28" y="176" width="96" height="26" rx="13" fill="#06525c" stroke="#2fb4c4" stroke-opacity=".6"/><text class="c" x="76.0" y="194" text-anchor="middle">Citations</text><rect x="132" y="176" width="80" height="26" rx="13" fill="#06525c" stroke="#2fb4c4" stroke-opacity=".6"/><text class="c" x="172.0" y="194" text-anchor="middle">Refusal</text></g></svg>