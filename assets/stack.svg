<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 70" width="1200" height="70" role="img" aria-label="Python, FastAPI, PostgreSQL, pgvector, TypeScript, Next.js, Docker, Playwright">
  <style>
    .t{font:600 18px 'SFMono-Regular',Consolas,monospace;fill:#f7f9f8}
    .p{fill:#06525c;stroke:#2fb4c4;stroke-opacity:.6}
    .g{animation:f 3s ease-in-out infinite}
    @keyframes f{50%{transform:translateY(-6px)}}
    @media (prefers-reduced-motion:reduce){.g{animation:none}}
  </style>
  <g transform="translate(0 14)">
    <g class="g"><rect class="p" x="2" y="0" width="108" height="38" rx="19"/><text class="t" x="56" y="25" text-anchor="middle">Python</text></g>
    <g class="g" style="animation-delay:.2s"><rect class="p" x="122" y="0" width="108" height="38" rx="19"/><text class="t" x="176" y="25" text-anchor="middle">FastAPI</text></g>
    <g class="g" style="animation-delay:.4s"><rect class="p" x="242" y="0" width="148" height="38" rx="19"/><text class="t" x="316" y="25" text-anchor="middle">PostgreSQL</text></g>
    <g class="g" style="animation-delay:.6s"><rect class="p" x="402" y="0" width="128" height="38" rx="19"/><text class="t" x="466" y="25" text-anchor="middle">pgvector</text></g>
    <g class="g" style="animation-delay:.8s"><rect class="p" x="542" y="0" width="148" height="38" rx="19"/><text class="t" x="616" y="25" text-anchor="middle">TypeScript</text></g>
    <g class="g" style="animation-delay:1s"><rect class="p" x="702" y="0" width="108" height="38" rx="19"/><text class="t" x="756" y="25" text-anchor="middle">Next.js</text></g>
    <g class="g" style="animation-delay:1.2s"><rect class="p" x="822" y="0" width="108" height="38" rx="19"/><text class="t" x="876" y="25" text-anchor="middle">Docker</text></g>
    <g class="g" style="animation-delay:1.4s"><rect class="p" x="942" y="0" width="128" height="38" rx="19"/><text class="t" x="1006" y="25" text-anchor="middle">Playwright</text></g>
  </g>
</svg>
