<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="Cleo, Abhishek Dey. AI engineer and product builder.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06525c"/><stop offset="1" stop-color="#032f36"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6a2b" stop-opacity=".55"/><stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b8a99"/><stop offset="1" stop-color="#0a4f5a"/></linearGradient>
    <linearGradient id="face2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d6572"/><stop offset="1" stop-color="#05333b"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="360" rx="18"/></clipPath>
  </defs>
  <style>
    .name{font:800 92px Impact,'Arial Narrow',sans-serif;letter-spacing:2px;fill:#f7f9f8}
    .tag{font:500 24px 'SFMono-Regular',Consolas,monospace;fill:#9fd6dc}
    .ember{fill:#ff6a2b}
    .l1{opacity:0;animation:line 12s infinite}
    .l2{animation-delay:3s}.l3{animation-delay:6s}.l4{animation-delay:9s}
    @keyframes line{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-8px)}}
    .rise{animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
    @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
    .spark{animation:spark 5s linear infinite;opacity:0}
    @keyframes spark{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(-190px)}}
    .cur{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.l1{opacity:1}.l2,.l3,.l4{display:none}}
  </style>
  <g clip-path="url(#c)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <g opacity=".08" stroke="#fff"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/></g>
    <circle cx="900" cy="180" r="170" fill="url(#glow)">
      <animate attributeName="r" values="150;190;150" dur="4s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(900 180)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
        <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60" fill="url(#face2)" stroke="#2fb4c4" stroke-opacity=".5"/>
        <polygon points="0,-120 104,-60 0,0" fill="url(#face1)"/>
        <polygon points="0,0 104,-60 104,60" fill="#0b5c68"/>
        <polygon points="0,0 -104,-60 0,-120" fill="#0f7482"/>
        <path d="M-60 -30L-10 10L30 -20L60 40" fill="none" stroke="#ff6a2b" stroke-width="3" stroke-linecap="round">
          <animate attributeName="stroke-opacity" values=".4;1;.4" dur="2.4s" repeatCount="indefinite"/>
        </path>
        <path d="M-10 10L-30 70" fill="none" stroke="#ff6a2b" stroke-width="2" stroke-linecap="round" stroke-opacity=".8"/>
      </g>
    </g>
    <g class="ember">
      <circle class="spark" cx="780" cy="300" r="3"/><circle class="spark" style="animation-delay:1.1s" cx="860" cy="320" r="2.5"/>
      <circle class="spark" style="animation-delay:2.3s" cx="940" cy="310" r="3.5"/><circle class="spark" style="animation-delay:3.4s" cx="1010" cy="325" r="2"/>
      <circle class="spark" style="animation-delay:.6s" cx="1060" cy="300" r="3"/>
    </g>
    <text class="name rise" x="60" y="165">CLEO</text>
    <rect class="rise" x="64" y="185" width="90" height="6" rx="3" fill="#ff6a2b"/>
    <g class="tag">
      <text class="l1" x="64" y="245">AI engineer &amp; product builder</text>
      <text class="l1 l2" x="64" y="245">RAG assistants that cite their sources</text>
      <text class="l1 l3" x="64" y="245">Chrome extensions that keep data local</text>
      <text class="l1 l4" x="64" y="245">MSc Economics, South Ural State University</text>
      <text class="cur" x="64" y="290" fill="#ff6a2b">_</text>
    </g>
  </g>
</svg>
