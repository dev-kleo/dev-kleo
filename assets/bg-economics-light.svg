<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 200" width="390" height="200" role="img" aria-label="Economics. International business, with a focus on how information and prices reach decision makers."><style>
text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif}
.k{font-size:12px;font-weight:600;letter-spacing:1.5px;fill:#0066cc}
.h{font-size:40px;font-weight:700;letter-spacing:-1px;fill:#1d1d1f}
.t{font-size:26px;font-weight:600;letter-spacing:-.5px;fill:#1d1d1f}
.b{font-size:15px;font-weight:400;fill:#6e6e73}
.c{font-size:12px;font-weight:500;fill:#6e6e73}
.in{opacity:0;animation:in .9s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sw{stroke-dasharray:90 910;animation:sw 6s linear infinite}
@keyframes sw{to{stroke-dashoffset:-1000}}
.pu{animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{opacity:.3}}
.fl{animation:fl 3.2s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
<g class="in" style="animation-delay:0s">
<rect x="1" y="1" width="388" height="198" rx="22" fill="#f5f5f7" stroke="#e5e5ea"/>
<rect class="sw" x="1" y="1" width="388" height="198" rx="22" fill="none" stroke="#0066cc" stroke-width="2" stroke-opacity=".7" pathLength="1000" style="animation-delay:0s"/>
<circle class="pu" cx="356" cy="36" r="5" fill="#0066cc"/>
<text class="k" x="28" y="40">FIELD</text><text class="t" x="28" y="68">Economics</text><text class="b" x="28" y="88">International business, with a focus on how</text><text class="b" x="28" y="110">information and prices reach decision</text><text class="b" x="28" y="132">makers.</text><rect x="28" y="154" width="89" height="28" rx="14" fill="#ffffff" stroke="#d2d2d7"/><text class="c" x="72.5" y="172" text-anchor="middle">Economics</text><rect x="125" y="154" width="117" height="28" rx="14" fill="#ffffff" stroke="#d2d2d7"/><text class="c" x="183.5" y="172" text-anchor="middle">Intl business</text></g></svg>